{{- if .IsHome -}}
<script type="application/ld+json">{"@context":"https://schema.org","@type":"WebSite","url":{{ .Site.BaseURL | jsonify }},"name":{{ .Site.Title | jsonify }},"potentialAction":{"@type":"SearchAction","target":{"@type":"EntryPoint","urlTemplate":"{{ .Site.BaseURL }}search/?q={search_term_string}"},"query-input":"required name=search_term_string"}}</script>
{{- else if .IsPage -}}
<script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Article","headline":{{ .Title | jsonify }},"datePublished":{{ .PublishDate.Format "2006-01-02" | jsonify }},"dateModified":{{ .Lastmod.Format "2006-01-02" | jsonify }},"author":{"@type":"Organization","name":{{ .Site.Title | jsonify }}},"publisher":{"@type":"Organization","name":{{ .Site.Title | jsonify }}},"url":{{ .Permalink | jsonify }}{{ if .Params.image }},"image":{{ .Params.image | jsonify }}{{ end }}},{"@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Home","item":{{ .Site.BaseURL | jsonify }}}{{ if .Params.categories }},{"@type":"ListItem","position":2,"name":{{ index .Params.categories 0 | title | jsonify }},"item":"{{ .Site.BaseURL }}categories/{{ index .Params.categories 0 | anchorize }}/"},{"@type":"ListItem","position":3,"name":{{ .Title | jsonify }},"item":{{ .Permalink | jsonify }}}{{ end }}]}]}</script>
{{- if .Params.faq }}
<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{{ range $i,$f := .Params.faq }}{{ if $i }},{{ end }}{"@type":"Question","name":{{ $f.question | jsonify }},"acceptedAnswer":{"@type":"Answer","text":{{ $f.answer | jsonify }}}}{{ end }}]}</script>
{{- end }}
{{- end -}}
